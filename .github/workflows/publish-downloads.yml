name: Publish NeoWorks downloads
on:
  push:
    branches: [main]
    paths: ['incoming/**', 'scripts/publish.py', '.github/workflows/publish-downloads.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-release-catalogue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Publish and verify release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/test_publish.py
          git pull --ff-only origin main
          python scripts/publish.py
      - name: Save verified catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "NeoWorks release publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add catalogue/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update verified NeoWorks download catalogue"
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/publish.py
          done
          echo "Catalogue push was rejected after three attempts" >&2
          exit 1
