name: Publish NeoWorks downloads
on:
  push:
    branches: [main]
    paths: ['incoming/**', 'scripts/publish.py', '.github/workflows/publish-downloads.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-release-catalogue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Publish and verify release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/test_publish.py
          python scripts/publish.py
      - name: Save verified catalogue
        run: |
          git config user.name "NeoWorks release publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue/
          if ! git diff --cached --quiet; then
            git commit -m "Update verified NeoWorks download catalogue"
            git push origin HEAD:main
          fi
